name: Build cross-platform docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push'
        required: true
        type: string
        default: 'latest'

env:
  platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: unblock-netease-music-enhanced

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout
              uses: actions/checkout@v7

            - name: Extract Docker metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
                tags: |
                  type=raw,value=latest
                  type=raw,value=${{ github.event.inputs.tag || github.ref_name }},enable=${{ (github.event.inputs.tag || github.ref_name) != 'latest' }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push the latest version
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ env.platforms }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
